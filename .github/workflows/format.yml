name: Format Check

on:
  push:
    paths:
      - src/**
      - scripts/**
    branches:
      - main

  pull_request:
    paths:
      - src/**
      - scripts/**
    branches:
      - main

  workflow_dispatch:

jobs:
  formatting-check:
    name: Formatting Check

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # clang-format 20 from PyPI: the apt.llvm.org install fails when the runner cannot resolve it.
    - name: Install packages
      run: pip install clang-format==20.1.8 yapf

    - name: Run clang-format style check.
      run: >
        find . -iname *.hh -o -iname *.cc | xargs -I{} clang-format --dry-run -Werror {}

    - name: Run yapf style check.
      run: >
        find . -iname *.py | xargs -I{} yapf -d {}
